spring.application.name=casa-vip
spring.profiles.default=demo
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.private-root=${PRIVATE_ROOT:./private-files}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8100,http://127.0.0.1:8100}
logging.level.root=INFO

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
